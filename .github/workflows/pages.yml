name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch photos from the private assets repo
        uses: actions/checkout@v4
        with:
          repository: giladgoldman/portfolio-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: _assets
      - name: Add photos to the site
        run: cp _assets/img/*.jpg _assets/img/*.webp img/
      - name: Build pages from src/pages
        run: python3 build.py
      - name: Assemble site (public files only)
        run: |
          mkdir _site
          cp *.html CNAME robots.txt sitemap.xml llms.txt _site/
          cp -r css js fonts img _site/
          rm -f _site/preview.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
